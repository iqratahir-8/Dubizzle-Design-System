<!--@ {"title":"Saved searches | dubizzle Egypt","header":"none","bodyClass":"page-bg-search","bottomNav":"ads","note":"Second tab of Favourites on mobile. Row layout is a proposal, not measured on live."} @-->

<header class="header-mobile">
  <div class="header-mobile__top">
    <h1 class="header-mobile__title">Favourites</h1>
  </div>
  <div class="tabs">
    <button class="tabs__tab">Favourites</button>
      <button class="tabs__tab tabs__tab--active">Saved searches</button>
  </div>
</header>

<main class="container">
  <ul class="results-list">
    <li><article class="saved-search">
      <div class="saved-search__body">
        <h2 class="saved-search__title" data-ugc>Apartments for sale in Zamalek</h2>
        <div class="attr-chips">
          <span class="attr-chip">Location <strong>Zamalek, Cairo</strong></span>
          <span class="attr-chip">Beds <strong>3+</strong></span>
          <span class="attr-chip">Price <strong>EGP 5,000,000 – 10,000,000</strong></span>
        </div>
      </div>
      <div class="saved-search__actions">
        <a class="btn btn--secondary btn--sm" href="#">View results</a>
        <button class="saved-search__delete" aria-label="Delete saved search"><img src="../../icons/action/delete.svg" alt=""></button>
      </div>
    </article></li>
    <li><article class="saved-search">
      <div class="saved-search__body">
        <h2 class="saved-search__title" data-ugc>Mercedes-Benz cars in Giza</h2>
        <div class="attr-chips">
          <span class="attr-chip">Brand <strong>Mercedes-Benz</strong></span>
          <span class="attr-chip">Location <strong>Giza</strong></span>
          <span class="attr-chip">Price <strong>Up to EGP 3,000,000</strong></span>
        </div>
      </div>
      <div class="saved-search__actions">
        <a class="btn btn--secondary btn--sm" href="#">View results</a>
        <button class="saved-search__delete" aria-label="Delete saved search"><img src="../../icons/action/delete.svg" alt=""></button>
      </div>
    </article></li>
  </ul>
</main>
